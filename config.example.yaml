# Copy this file to config.yaml and edit it. config.yaml is git-ignored.
# Do NOT put API keys here. Keys go in .env (copy .env.example).

search:
  # One search per line. Use the job titles you actually want.
  queries:
    - "CRM manager"
    - "marketing operations"
    - "lifecycle marketing"
  location: "Singapore"          # e.g. "Dublin, Ireland", "Hong Kong", "London, United Kingdom", "Remote"
  sources: [jooble, serpapi]     # remove one if you only have one key
  language: en                   # language of Google Jobs results (SerpApi)
  results_per_query: 40          # Jooble results per query

scoring:
  alert_min_fit: 85      # your personal "worth applying" bar (Fit %)
  ats_target: 80         # recruiter / ATS bar for your CV wording (ATS Match %)
  tracker_min_fit: 70    # jobs at or above this go into data/jobs.xlsx for review
  max_jobs_per_run: 60   # limits AI usage per day
  max_description_chars: 6000

profile:
  cv_file: my-data/master-cv.md              # .md, .txt or .docx
  skill_profile_file: my-data/skill-profile.md

notify:
  channels: [telegram]   # or [terminal] to just print the digest

reports:
  progress_day: monday   # weekly progress report day (sent with that day's digest); "never" to turn off

storage:
  keep_raw_days: 3       # raw API results older than this are deleted

# Which AI scores your jobs every day. See docs/05-choose-your-ai.md.
engine:
  type: codex            # codex (ChatGPT plan) | claude (Claude plan) | api (any OpenAI-compatible API)
  command: ""            # optional full path to the codex / claude program if the scheduler cannot find it
  # Only for type: api. The key goes in .env as LLM_API_KEY.
  base_url: https://api.openai.com/v1
  model: ""              # e.g. gpt-4.1-mini, deepseek-chat, qwen-plus, llama3.1 (Ollama)
  batch_size: 10
  key_header: Authorization   # use api-key for Azure OpenAI
